name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify Syntax
        run: |
          python -m py_compile server.py telegram_service.py login.py

      - name: Secret & Credential Leak Check
        run: |
          # Ensure sensitive files are not committed
          if [ -f ".env" ]; then
            echo "ERROR: .env file found in repository!"
            exit 1
          fi
          # Check for forbidden session patterns in git tracked files
          if git grep -i "1422873" -- ':!*.log'; then
            echo "Warning: Temporary artifacts detected."
          fi

      - name: Run Unit Tests
        run: |
          python -m pytest tests -v
